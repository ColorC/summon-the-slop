[package]
name = "poof"
version = "0.1.0"
description = "Poof, There It Is — summoned overlay shell for omnidashboard-os"
authors = ["you"]
edition = "2021"

[lib]
name = "poof_lib"
# desktop-only: rlib only. (cdylib/staticlib are for mobile and overflow the
# mingw/gnu linker's export-ordinal limit — "export ordinal too large".)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
nucleo-matcher = "0.3"
ignore = "0.4"
rayon = "1"
notify = "6"
# screenshot (GDI 快照) + live-inspector 洞察 (capture/uia/ocr/inspect, ported from waiela)
xcap = "0.9.6"
uiautomation = "0.25.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
base64 = "0.22.1"
arboard = "3.6.1"
imageproc = "0.25"
ab_glyph = "0.2"
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Storage", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
windows-future = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
] }
