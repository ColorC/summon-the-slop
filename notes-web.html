<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>overlay-shell 笔记</title>
    <script>
      (function () {
        var requested = new URLSearchParams(location.search).get("theme") || "";
        var workshop = requested === "workshop" || requested === "warm";
        document.documentElement.dataset.notesTheme = workshop ? "workshop" : "omni";
        document.documentElement.style.colorScheme = workshop ? "light" : "dark";
        document.documentElement.style.background = workshop ? "#F7F3EB" : "#0b1830";
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1830;
      }
      html[data-notes-theme='workshop'],
      html[data-notes-theme='workshop'] body {
        background: #F7F3EB;
      }
      #app {
        height: 100%;
        position: relative; /* 画布根是 absolute, 由这里容住 */
      }
      .notes-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        color: #dbe7f5;
        font: 14px/1.5 system-ui, sans-serif;
        background: inherit;
      }
      html[data-notes-theme='workshop'] .notes-boot {
        color: #332D27;
      }
      .notes-boot small {
        color: #7890ad;
      }
      html[data-notes-theme='workshop'] .notes-boot small {
        color: #9A8B7D;
      }
      .notes-boot-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #2f4662;
        border-top-color: #75b7ff;
        border-radius: 50%;
        animation: notes-boot-spin 0.8s linear infinite;
      }
      .notes-boot button {
        margin-top: 4px;
        padding: 7px 14px;
        border: 1px solid #45617f;
        border-radius: 6px;
        color: #dbe7f5;
        background: #162b45;
        cursor: pointer;
      }
      @keyframes notes-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="notes-boot" data-notes-boot="loading" role="status" aria-live="polite">
        <span class="notes-boot-spinner" aria-hidden="true"></span>
        <strong>正在加载札记…</strong>
        <small>首次打开可能需要几秒</small>
      </div>
    </div>
    <script type="module" src="/src/notes-web.tsx"></script>
  </body>
</html>
